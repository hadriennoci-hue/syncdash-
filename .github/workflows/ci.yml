name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sharp falls back to compiling from source when its prebuilt binary can't be
      # fetched; without the libvips headers that build fails and takes `npm ci` with it.
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sharp falls back to compiling from source when its prebuilt binary can't be
      # fetched; without the libvips headers that build fails and takes `npm ci` with it.
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sharp falls back to compiling from source when its prebuilt binary can't be
      # fetched; without the libvips headers that build fails and takes `npm ci` with it.
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - run: npm ci
      - run: npm run test -- --run --passWithNoTests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # sharp falls back to compiling from source when its prebuilt binary can't be
      # fetched; without the libvips headers that build fails and takes `npm ci` with it.
      - run: sudo apt-get update && sudo apt-get install -y libvips-dev
      - run: npm ci
      - run: npm run build
